[package]
name = "aion-mcp"
description = "MCP (Model Context Protocol) client implementation for aionrs"
version = "0.2.11"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iOfficeAI/aionrs.git"

[dependencies]
aion-types = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11", version = "0.2.11" }
aion-protocol = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11", version = "0.2.11" }
aion-tools = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11", version = "0.2.11" }
aion-config = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11", version = "0.2.11" }

tracing.workspace     = true
tokio.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
async-trait.workspace = true
thiserror.workspace   = true
anyhow.workspace      = true
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
bytes = "1"
workspace-hack = { git = "https://github.com/iOfficeAI/aionrs.git", tag = "v0.2.11", version = "0.1.0" }

[features]
test-utils = []

[dev-dependencies]
http.workspace = true
