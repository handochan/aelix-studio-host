# cargo-deny policy for the Aelix Studio host. CI runs every check on each
# push and pull request; see README.md "Dependency checks".

[graph]
# The five release targets (README.md "Releases").
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
# User-approved exception, distinct from an unresolved advisory baseline.
# The other 19 inherited advisories were resolved in host #7. Any future
# unresolved baseline entries must be documented separately from this exception.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "User decision 2026-11-03: unmaintained notice with no patched version; upstream aionrs aion-memory also requires unsafe-libyaml. Removal: handochan/aelix-studio-host#18 (Later)." },
]

[licenses]
# Every crate marked publish = false is skipped, including third-party ones.
# That is our workspace crates (license metadata: README.md "License") and,
# today, only aionrs' code-less hakari workspace-hack crate; [sources] limits
# git dependencies to aionrs.
private = { ignore = true }
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# zip 9 retains BZip2 support through this Rust implementation. Its distributed
# LICENSE uses bzip2-1.0.6; limit the additional permission to the reviewed crate.
[[licenses.exceptions]]
name = "libbz2-rs-sys"
version = "=0.2.6"
allow = ["bzip2-1.0.6"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Upstream's aionrs agent runtime, pinned by tag in Cargo.toml.
allow-git = ["https://github.com/iOfficeAI/aionrs.git"]
