name: Advisories

# Checks main against the RustSec advisory database once a week and on
# request. The database changes outside this repository, so ordinary pushes
# and pull requests do not run this check (ci.yml runs it only for a change
# that touches a dependency input) and this run is how a new advisory is
# noticed. A failing run on main creates, or reopens and rewrites, the single
# tracking Issue; a passing run closes it (scripts/deny/advisory_issue.py).
# See README.md "Dependency checks".
on:
  schedule:
    # Mondays 00:17 UTC. GitHub runs schedules from the default branch only and
    # disables them in a public repository after 60 days without repository
    # activity; re-enable the workflow in the Actions tab if that happens.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  check:
    name: RustSec advisories (cargo-deny)
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: ./.github/actions/cargo-deny
        with:
          checks: advisories
      - name: Name the failing advisories for the tracking Issue
        id: report
        if: failure()
        # Explicit bash adds pipefail, so a failed report is not masked by tee.
        shell: bash
        run: |
          # --frozen is --locked --offline: the database the failed step just fetched.
          cargo deny --frozen --format json check advisories 2> "${RUNNER_TEMP}/advisories.jsonl" || true
          python3 -I -B scripts/deny/advisory_issue.py report --input "${RUNNER_TEMP}/advisories.jsonl" \
            | tee -a "${GITHUB_OUTPUT}"

  tracking-issue:
    name: Tracking Issue
    needs: check
    # Only main is tracked: a manual run on another branch reports its own
    # result and leaves the Issue alone. A cancelled check records nothing.
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.check.result == 'success' || needs.check.result == 'failure') }}
    runs-on: ubuntu-24.04
    # The only job with a write permission; it runs no dependency tooling.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RESULT: ${{ needs.check.result }}
          REPORT: ${{ needs.check.outputs.report }}
        run: python3 -I -B scripts/deny/advisory_issue.py sync --result "${CHECK_RESULT}" --report "${REPORT}"
