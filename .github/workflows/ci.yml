name: CI

# Aelix Studio host CI. Replaces the upstream AionCore workflow; see README.md.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/migration/check-immutability.test.sh
      - run: bash scripts/migration/check-immutability.sh

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest
      - run: cargo nextest run --workspace

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      # The checks this repository decides alone; policy in deny.toml. Advisories
      # also depend on the RustSec database: see the two jobs below and
      # advisories.yml (README.md "Dependency checks").
      - uses: ./.github/actions/cargo-deny
        with:
          checks: bans licenses sources

  advisory-inputs:
    name: Advisory inputs
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -I -B -m unittest discover -s scripts/deny -p 'test_*.py' -v
      - id: detect
        # Explicit bash adds pipefail, so a failed detection is not masked by tee.
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python3 -I -B scripts/deny/changed_inputs.py --event "${GITHUB_EVENT_NAME}" --ref "${GITHUB_REF}" \
            --pr-base "${PR_BASE}" --pr-head "${PR_HEAD}" --before "${PUSH_BEFORE}" | tee -a "${GITHUB_OUTPUT}"

  advisories:
    name: RustSec advisories (dependency inputs changed)
    needs: advisory-inputs
    # Skipped unless this change touches a file that decides the result.
    if: needs.advisory-inputs.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: ./.github/actions/cargo-deny
        with:
          checks: advisories

  windows-staging:
    name: Windows staging and leases
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Preserve repository bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
      - name: Use the MSVC linker
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-windows-staging
      - name: Local and Upload attachment provenance
        env:
          HOST60_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: pwsh
        run: ./scripts/just/test-windows-attachment-provenance.ps1
      - name: Project file URI compatibility and Clippy
        run: |
          cargo clippy --locked --target x86_64-pc-windows-msvc -p aionui-project --all-targets -- -D warnings
          cargo test --locked --target x86_64-pc-windows-msvc -p aionui-project --lib canonical::canonical_test::legacy_file_uri_
          cargo test --locked --target x86_64-pc-windows-msvc -p aionui-project --test service reopening_reuses_legacy_file_uri_folder_and_project -- --exact
      # Includes real child-process leases/hard exits, unlock/relock races,
      # guard Drop/container removal and preservation of unmarked user data.
      - name: Staging ownership and lifecycle
        run: |
          cargo test --locked -p aionui-extension --lib skill_service::import_staging:: -- --test-threads=1
      - name: Import names, existing skills and ordinary ZIP regressions
        run: |
          cargo test --locked -p aionui-extension --test zip_import_security final_regressions:: -- --test-threads=1
      - name: Partial-file response and nullable history
        run: |
          cargo test --locked -p aionui-extension --test zip_import_security review_regressions::http_200_preserves_per_skill_failure_fields_and_imports_the_other_skill -- --exact --test-threads=1
      - name: ACP child stdin backpressure and revocation
        run: |
          cargo test --locked -p aionui-ai-agent --lib acp_relay_windows_child_stdin_ -- --test-threads=1

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/check-glibc-baseline.test.sh
      - run: python3 -I -B -m unittest discover -s scripts/release -p 'test_*.py' -v

  smoke:
    name: Host smoke (linux-x64, debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-smoke
      - run: cargo build --locked -p aionui-app --bin aelix-studio-host
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: Audit detector positive control (must fail with outbound attempts)
        run: |
          set +e
          python3 -I -B scripts/release/outbound_audit.py --report smoke/positive-control.json -- python3 -I -B scripts/release/outbound_audit.py --positive-control
          result=$?
          set -e
          test "$result" -eq 86
      - name: Audit child-process positive control
        run: |
          set +e
          python3 -I -B scripts/release/outbound_audit.py --report smoke/child-positive-control.json -- python3 -I -B scripts/release/outbound_audit.py --child-positive-control
          result=$?
          set -e
          test "$result" -eq 86
      - name: Trace default host startup, session and shutdown
        run: python3 -I -B scripts/release/outbound_audit.py --report smoke/outbound.json -- python3 -I -B scripts/release/smoke.py --binary target/debug/aelix-studio-host --report smoke/report.json
      - name: Prepare official Node archive fixture (setup outside runtime audit)
        run: |
          mkdir -p smoke/node-fixture/node
          curl --fail --show-error --silent https://nodejs.org/dist/v24.11.0/node-v24.11.0-linux-x64.tar.gz -o smoke/node-v24.11.0-linux-x64.tar.gz
          (cd smoke && sha256sum --ignore-missing -c ../crates/aionui-runtime/src/node_runtime/node-v24.11.0-SHASUMS256.txt)
          tar -xzf smoke/node-v24.11.0-linux-x64.tar.gz -C smoke/node-fixture/node
      - name: Trace real npm/npx using only the configured loopback registry
        run: python3 -I -B scripts/release/outbound_audit.py --report smoke/mirror-outbound.json -- python3 -I -B scripts/release/mirror_smoke.py --binary target/debug/aelix-studio-host --node-root smoke/node-fixture --node-archive smoke/node-v24.11.0-linux-x64.tar.gz --report smoke/mirror.json
      - run: python3 -I -B scripts/verification/smoke_prompt_recovery.py --binary target/debug/aelix-studio-host --output smoke/prompt-recovery
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-host-smoke
          path: |
            smoke/*.json
            smoke/prompt-recovery/
          if-no-files-found: ignore
          retention-days: 14
