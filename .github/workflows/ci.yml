name: CI

# Aelix Studio host CI. Replaces the upstream AionCore workflow; see README.md.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/migration/check-immutability.test.sh
      - run: bash scripts/migration/check-immutability.sh

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest
      - run: cargo nextest run --workspace

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # advisories, bans, licenses and sources; policy and baseline in deny.toml.
      - run: cargo deny --locked check

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/check-glibc-baseline.test.sh
      - run: python3 -I -B -m unittest discover -s scripts/release -p 'test_*.py' -v

  smoke:
    name: Host smoke (linux-x64, debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-smoke
      - run: cargo build --locked -p aionui-app --bin aelix-studio-host
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: Audit detector positive control (must fail with outbound attempts)
        run: |
          set +e
          python3 -I -B scripts/release/outbound_audit.py --report smoke/positive-control.json -- python3 -I -B scripts/release/outbound_audit.py --positive-control
          result=$?
          set -e
          test "$result" -eq 86
      - name: Trace default host startup, session and shutdown
        run: python3 -I -B scripts/release/outbound_audit.py --report smoke/outbound.json -- python3 -I -B scripts/release/smoke.py --binary target/debug/aelix-studio-host --report smoke/report.json
      - name: Prepare pinned Node fixture (test setup, outside runtime audit)
        run: |
          mkdir -p smoke/node-fixture/node/node-v24.11.0-linux-x64
          docker run --rm --network none -v "$PWD/smoke/node-fixture/node/node-v24.11.0-linux-x64:/out" \
            docker.io/library/node:24.11.0-bookworm-slim@sha256:76d0ed0ed93bed4f4376211e9d8fddac4d8b3fbdb54cc45955696001a3c91152 \
            sh -eu -c 'mkdir -p /out/bin /out/lib; cp -a /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /out/bin/; cp -a /usr/local/lib/node_modules /out/lib/'
      - name: Trace real npm/npx using only the configured loopback registry
        run: python3 -I -B scripts/release/outbound_audit.py --report smoke/mirror-outbound.json -- python3 -I -B scripts/release/mirror_smoke.py --binary target/debug/aelix-studio-host --node-root smoke/node-fixture --report smoke/mirror.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-host-smoke
          path: smoke/*.json
          if-no-files-found: ignore
          retention-days: 14
