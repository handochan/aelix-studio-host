name: Release

# Builds the five aioncore release targets, runs the host smoke on each
# target's own runner, and assembles checksums and provenance.
#
# Only a pushed tag matching host-v<version>-aelix.<n> on a commit already on
# main publishes a GitHub release. Upstream AionCore tags (v*) never match.
# Pull requests and manual runs are dry runs: they upload the same assets as
# workflow artifacts and publish nothing. See README.md "Releases".
on:
  push:
    tags: ["host-v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "scripts/check-glibc-baseline.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"
  RUST_TOOLCHAIN: "1.95.0"
  # Build the pull request head itself, not the merge preview.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare:
    name: Validate ref
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.gate.outputs.label }}
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0
      - id: gate
        # Explicit bash adds pipefail, so a failed gate is not masked by tee.
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" | tee -a "${GITHUB_OUTPUT}"
          python3 -I -B scripts/release/provenance.py prepare --event "${GITHUB_EVENT_NAME}" --ref "${GITHUB_REF}" \
            | tee -a "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15, python: python3 }
          - { target: darwin-x64, runner: macos-15-intel, python: python3 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, python: python3 }
          - { target: linux-x64, runner: ubuntu-24.04, python: python3 }
          - { target: win32-x64, runner: windows-2022, python: python }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.python }}
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - name: Check out exact repository bytes (no CRLF conversion)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install the pinned Rust toolchain
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - name: Use the MSVC linker (remove Git's link.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue
      - name: Build, check and package
        run: |
          cargo_args=()
          if [[ "${TARGET}" != linux-* ]]; then
            cargo_args=(--cargo "$(rustup which --toolchain "${RUST_TOOLCHAIN}" cargo)")
          fi
          "${PYTHON}" -I -B scripts/release/build.py --target "${TARGET}" --label "${LABEL}" \
            --output "dist/release-${TARGET}" --target-dir "${RUNNER_TEMP}/cargo-target" "${cargo_args[@]}"
      - name: Host smoke
        run: |
          binary=aioncore
          if [[ "${TARGET}" == win32-* ]]; then binary=aioncore.exe; fi
          "${PYTHON}" -I -B scripts/release/smoke.py --binary "dist/release-${TARGET}/${binary}" \
            --report "dist/release-${TARGET}/smoke.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/release-${{ matrix.target }}/build-receipt.json
            dist/release-${{ matrix.target }}/smoke.json
            dist/release-${{ matrix.target }}/aioncore-*
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Checksums and provenance
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/targets
      - env:
          LABEL: ${{ needs.prepare.outputs.label }}
        run: |
          python3 -I -B scripts/release/provenance.py assemble --label "${LABEL}" \
            --input "${RUNNER_TEMP}/targets" --output dist/assets --notes dist/release-notes.md
          (cd dist/assets && sha256sum -c aioncore-checksums.txt)
          cat dist/release-notes.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ needs.prepare.outputs.label }}
          path: |
            dist/assets/*
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: [prepare, assemble]
    if: needs.prepare.outputs.publish == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/host-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets-${{ needs.prepare.outputs.label }}
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.label }}
        run: |
          (cd dist/assets && sha256sum -c aioncore-checksums.txt)
          # Refuses an existing release; assets are never replaced in place.
          gh release create "${TAG}" dist/assets/* --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${TAG}" --notes-file dist/release-notes.md --latest
